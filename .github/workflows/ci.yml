name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
      - name: Install CPython 3.11 and locked dependencies
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Compile
        run: uv run --no-sync python -m compileall -q src scripts
      - name: Provisional UI syntax
        run: |
          node --check ui/app.js
          node --check scripts/smoke_ui_logic.cjs
      - name: Fixture tests
        run: uv run --no-sync pytest tests -q
