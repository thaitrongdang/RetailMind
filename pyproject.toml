[project]
name = "retailmind"
version = "0.1.0"
description = "Time-aware retail product recommendation and evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb==1.5.6",
  "implicit==0.7.3",
  "numpy==2.4.6",
  "openpyxl==3.1.5",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "scipy==1.17.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
retailmind = "retailmind.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
